<veta-cabecera-seccion
  antetitulo="El estudio"
  titulo="Quiénes somos"
  [entradilla]="textos()['entradilla']"
/>

@if (textos()['esloganFrase']) {
  <section class="vt-seccion vt-seccion--crema qs__eslogan">
    <p class="vt-contenedor qs__eslogan-frase" [vetaFuente]="estilos()['esloganFrase']">
      @for (linea of lineasEslogan(); track $index) {
        {{ linea }}@if (!$last) {<br />}
      }
    </p>
  </section>
}

<section class="vt-seccion qs">
  <div class="vt-contenedor qs__cuerpo">
    @if (hayBloque('queEsTexto')) {
      <article class="qs__bloque">
        <h2 class="vt-titulo qs__titulo" [vetaFuente]="estilos()['queEsTitulo']">
          {{ textos()['queEsTitulo'] }}
        </h2>
        <veta-bloque-ilustrado
          [imagen]="imagenes()['queEsImagen'] ?? null"
          [html]="textos()['queEsTexto']"
        />
      </article>
    }

    @if (hayBloque('quienesTexto')) {
      <article class="qs__bloque">
        <h2 class="vt-titulo qs__titulo" [vetaFuente]="estilos()['quienesTitulo']">
          {{ textos()['quienesTitulo'] }}
        </h2>
        <veta-bloque-ilustrado
          [imagen]="imagenes()['quienesImagen'] ?? null"
          [html]="textos()['quienesTexto']"
        />
      </article>
    }
  </div>
</section>
